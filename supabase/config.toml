project_id = "orca-facil"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true

[edge_runtime]
enabled = true

[functions.send-invite-email]
# Exige JWT válido de um usuário autenticado — a function ainda faz sua
# própria checagem via RLS (ver supabase/functions/send-invite-email), isso
# aqui é uma primeira barreira na borda antes do código rodar.
verify_jwt = true
