project_id = "orca-facil"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true

[edge_runtime]
enabled = true

[functions.send-invite-email]
# Exige JWT válido de um usuário autenticado — a function ainda faz sua
# própria checagem via RLS (ver supabase/functions/send-invite-email), isso
# aqui é uma primeira barreira na borda antes do código rodar.
verify_jwt = true

[functions.employee-admin]
# Gestão de funcionários. JWT obrigatório na borda; o handler valida o token de
# novo e todas as escritas passam por RPCs chamadas com o JWT do próprio ator.
verify_jwt = true

[functions.push-test]
# Notificação de teste para UM aparelho do próprio usuário. JWT obrigatório na borda; o handler valida o token
# de novo e o usuário vem do JWT (nunca do corpo).
verify_jwt = true

[functions.push-dispatch]
# Chamada SÓ pelo banco (pg_net) com o segredo compartilhado no header x-internal-secret (>= 32 caracteres,
# comparação em tempo constante); não há JWT de usuário nessa chamada.
verify_jwt = false

[functions.billing-charge]
# Cobrança Pix de UMA fatura, pedida pelo OWNER. JWT obrigatório na borda; o handler valida o token de novo, a
# autorização (owner + fatura da empresa) é decidida no banco com o JWT do usuário, e o corpo só aceita invoice_id.
verify_jwt = true

[functions.asaas-webhook]
# Webhook do Asaas (público). Autenticação = header asaas-access-token (ASAAS_WEBHOOK_TOKEN, tempo constante); o
# pagamento é reconsultado no Asaas antes de qualquer mudança de estado.
verify_jwt = false

[functions.billing-worker]
# Chamada SÓ pelo banco (pg_net) com o segredo compartilhado no header x-internal-secret (>= 32 caracteres, tempo
# constante); não há JWT de usuário nessa chamada.
verify_jwt = false
